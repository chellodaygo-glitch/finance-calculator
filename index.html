  });
}

// One-time "Add to Home Screen" hint for iOS/iPadOS browser tabs. iPadOS Safari reports a Mac
// user agent, so detect it by touch support.
(() => {
  const HINT_KEY = 'fin-calc-install-hint-dismissed';
  const ua = navigator.userAgent;
  const ios = /iPad|iPhone|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const standalone = navigator.standalone === true ||
    ['standalone', 'fullscreen', 'minimal-ui'].some(m => matchMedia(`(display-mode: ${m})`).matches);
  let dismissed = false;
  try { dismissed = localStorage.getItem(HINT_KEY) === '1'; } catch {}
  if (!web || !ios || standalone || dismissed) return;
  const hint = document.createElement('div');
  hint.className = 'install-hint';
  hint.setAttribute('role', 'note');
  hint.innerHTML = '<p>Tap <b>Share</b> <svg class="share-glyph" viewBox="0 0 16 20" aria-hidden="true">' +
    '<path d="M8 12.5V1.5M4.5 5 8 1.5 11.5 5M5.5 8H2.5v10.5h11V8h-3" fill="none" stroke="currentColor" ' +
    'stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>, then ' +
    '<b>Add to Home Screen</b></p><button type="button" aria-label="Dismiss install tip">×</button>';
  const dismiss = () => {
    hint.remove();
    try { localStorage.setItem(HINT_KEY, '1'); } catch {}
  };
  hint.addEventListener('click', dismiss);
  document.querySelector('.face').append(hint);
})();
</script></body></html>
